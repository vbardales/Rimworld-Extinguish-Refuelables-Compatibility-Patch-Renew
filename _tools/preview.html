<!doctype html>
<meta charset="utf-8">
<title>Preview</title>
<style>
  /* The page IS the banner: 896 x 504, no margin, no scrollbar. Chrome headless
     screenshots it at exactly this size, so the text is composed at its final
     size and the glyphs are never resampled. The background image is the
     full-resolution source, scaled here rather than beforehand. */
  html, body { margin: 0; padding: 0; }
  body { width: 896px; height: 504px; overflow: hidden; }

  /* The source is 1536 x 1024, so cover crops a band off the top and the
     bottom. Both are empty - wall above, bare flagstones below - and the two
     braziers sit in the middle third, which survives untouched. */
  .frame {
    position: relative;
    width: 896px; height: 504px;
    background: url("../Art/Preview-source.png") center/cover no-repeat;
  }

  /* Radial darkening from the top-left corner, so the title sits on a calm
     ground without a visible rectangle. Values from STYLE_RIMWORLD.md. */
  .frame::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 0% 0%,
                rgba(6, 5, 4, .86) 0%,
                rgba(6, 5, 4, 0) 74%);
  }

  .text {
    position: absolute; z-index: 1;
    left: 50px; top: 52px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #ECE2CD;
    text-shadow: 0 3px 10px rgba(0, 0, 0, .75);
  }

  /* 40px rather than the usual 46: the name runs to three words on the second
     line, and at 46 it reached the lit brazier. */
  h1 {
    margin: 0;
    font-size: 40px; font-weight: 600; line-height: 1.1;
    letter-spacing: .2px;
  }

  .rule {
    width: 58px; height: 3px;
    background: #D68F2C;
    margin: 20px 0 16px;
  }

  p {
    margin: 0;
    width: 430px;
    font-size: 21px; font-weight: 400; line-height: 1.45;
    color: rgba(236, 226, 205, .88);
  }
</style>

<div class="frame">
  <div class="text">
    <h1>Extinguish Refuelables<br>Compatibility Patch Renew</h1>
    <div class="rule"></div>
    <p>Puts out Medieval Overhaul's and Vanilla Expanded's fires, the way Extinguish Refuelables puts out the rest.</p>
  </div>
</div>
